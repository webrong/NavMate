name: Release

# Triggered by pushing a version tag (v1.0.0, v1.1.0, ...).
# Builds a self-contained upgrade package (vendor + frontend build),
# creates a GitHub Release for that tag, and attaches the zip as an asset.
#
# Usage: tag a commit and push it.
#   git tag -a v1.1.0 -m "v1.1.0: release notes"
#   git push origin v1.1.0
#
# Everything else (build + release + asset upload) is automated.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a package for (e.g. v1.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build-package:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # GITHUB_REF for a tag push looks like refs/tags/v1.1.0
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0   # full history for changelog generation

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, tokenizer, xml, curl, gd, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # NOTE: deliberately NOT using `cache: 'npm'`. The npm cache can be
          # restored with a stale hash after package-lock.json churns, which
          # causes `npm ci` to fail cryptically in ~20s with no clear message.
          # We instead let npm populate its own cache on this run; the cost is
          # ~15s extra per release which is negligible for a release pipeline.

      - name: Install npm dependencies
        # `npm install` instead of `npm ci`: ci is strict and fails the build
        # on any package-lock.json / package.json drift. We've occasionally
        # committed a lock that lags the manifest by a transitive version, and
        # we'd rather the release self-heal than block on a pedantic check.
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f artisan || { echo "::error::artisan missing"; exit 1; }
          test -f composer.json || { echo "::error::composer.json missing"; exit 1; }
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php missing"; exit 1; }
          test -f public/build/manifest.json || { echo "::error::public/build/manifest.json missing"; exit 1; }

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Collect commit subjects since the previous tag (or all if first tag).
          TAG="${{ steps.tag.outputs.name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            LOGS=$(git log --pretty=format:'- %s' "$RANGE")
          else
            LOGS=$(git log --pretty=format:'- %s' "$TAG" | head -30)
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容"
            echo ""
            echo "$LOGS"
            echo ""
            echo "---"
            echo ""
            echo "## 升级方式"
            echo ""
            echo "### 已部署用户（推荐）"
            echo "1. 登录后台管理"
            echo "2. 进入「系统管理 → 系统升级」"
            echo "3. 点击「检查更新」，看到 ${TAG}"
            echo "4. 点击「立即升级」，等待自动完成"
            echo ""
            echo "### 手动升级"
            echo "1. 下载下方 \`${TAG#v}\` 的 zip"
            echo "2. 解压覆盖项目目录（保留 \`.env\` 和 \`storage\`）"
            echo "3. 运行 \`php artisan migrate --force\`"
            echo "4. 运行 \`php artisan config:clear && php artisan cache:clear\`"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble package
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          PKG_DIR="navmate-${VERSION}"
          ZIP_NAME="navmate-${VERSION}.zip"

          mkdir -p "stage/${PKG_DIR}"

          # Copy project into staging, excluding things UpdateService preserves
          # (or that must never ship).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='*.zip' \
            --exclude='*.sql' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='docs' \
            --exclude='CLEANUP_REPORT.md' \
            --exclude='_*.py' \
            --exclude='_*.php' \
            ./ "stage/${PKG_DIR}/"

          # Zip from inside stage/ so the archive has a single root subdir
          # (UpdateService's extractAndReplace auto-detects this).
          (cd stage && zip -r "../${ZIP_NAME}" "${PKG_DIR}" -q)

          echo "zip_name=${ZIP_NAME}" >> $GITHUB_ENV
          echo "zip_path=$(pwd)/${ZIP_NAME}" >> $GITHUB_ENV
          echo "## Upgrade package built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`${ZIP_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: \`$(du -h "${ZIP_NAME}" | cut -f1)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY

      - name: Create or update release with asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"

          # Create the release (with auto-generated changelog as notes), or,
          # if it already exists (e.g. user created it in the web UI first),
          # just upload/replace the asset.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading asset."
            gh release upload "${TAG}" "${{ env.zip_path }}" --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file - \
              "${{ env.zip_path }}" <<< "${{ steps.changelog.outputs.body }}"
          fi

      - name: Upload as artifact (manual dispatch only)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}
          path: ${{ env.zip_path }}
