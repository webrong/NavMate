name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} · Tests & Pint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, openssl, tokenizer, xml, curl, gd, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Prepare application
        run: |
          # phpunit.xml supplies all env vars for tests, but the app needs an
          # APP_KEY to boot. Generate one into a minimal .env.
          cp .env.example .env
          php artisan key:generate
          # Smoke-test that the app boots — a config error here would otherwise
          # fail the test step opaquely (the tee'd output file is never created
          # because the step never reaches it).
          php artisan config:clear
          php artisan about > /dev/null

      - name: Run tests
        id: tests
        run: |
          # Capture full output so failures are visible in the job summary,
          # not just the truncated annotation.
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/test-output.txt
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Publish test output on failure
        if: failure()
        run: |
          {
            echo '## Test / prepare output'
            echo '```'
            if [ -f /tmp/test-output.txt ]; then
              cat /tmp/test-output.txt
            else
              echo '(test-output.txt not created — a step before "Run tests" failed)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    name: Frontend · Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install npm dependencies
        # `npm install` tolerates lockfile/manifest drift (a transitive
        # bump from a local `npm install --no-save` can leave the lock
        # slightly out of sync). `npm ci` would hard-fail on that.
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d public/build ]; then
            echo "::error::public/build was not produced — Vite build likely failed silently"
            exit 1
          fi
          echo "Build artifacts:"
          find public/build -maxdepth 2 -type f | head -20
